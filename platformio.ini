; Station météo embarquée 3W - groupe 3
;
;   pio run -e nucleo_l476rg              compiler (version client)
;   pio run -e nucleo_l476rg -t upload    compiler et téléverser
;   pio run -e demo -t upload             version de démonstration (temps accélérés)
;   pio device monitor                    console série (115 200 bauds)
;   pio test -e native                    tests de la logique sur PC (gcc requis)
;
; Les scripts du dossier scripts/ enchaînent ces commandes.

[platformio]
default_envs = nucleo_l476rg

[stm32]
platform = ststm32
board = nucleo_l476rg
framework = stm32cube
upload_protocol = stlink
; La dernière page de Flash (2 Ko) garde les paramètres : le programme ne doit pas y arriver.
board_upload.maximum_size = 1046528
build_flags =
	-Wl,-u,_printf_float
	-Wall
	-Wextra
	-Wno-unused-parameter
monitor_speed = 115200
monitor_echo = yes
monitor_eol = CRLF
monitor_filters = time, log2file

[env:nucleo_l476rg]
extends = stm32
; Version livrée au client : LOG_INTERVAL en minutes, 30 min d'inactivité.

[env:demo]
extends = stm32
; Même programme, temps accélérés pour la démonstration :
;   LOG_INTERVAL compté en secondes (10 -> 10 s), retour automatique du mode
;   configuration après 60 s, TIMEOUT par défaut de 5 s.
; Les appuis de 5 s ne changent pas.
build_flags =
	${stm32.build_flags}
	-D DEMO_BUILD
	-D LOG_UNIT_MS=1000UL
	-D CONFIG_IDLE_MS=60000UL
	-D CFG_DEF_TIMEOUT=5

; ---- Tests du matériel (branche test) : un programme autonome par composant ----
; pio run -e test_gps -t upload, puis pio device monitor. Le programme de la
; station (main.c et ses modules) n'est pas compilé dans ces environnements.
[materiel]
extends = stm32
build_flags = -Wl,-u,_printf_float

[env:test_boutons]
extends = materiel
build_src_filter = -<*> +<setup.c> +<../test/materiel/test_bouton_led.c>

[env:test_bme280]
extends = materiel
build_src_filter = -<*> +<setup.c> +<../test/materiel/test_bme280.c>

[env:test_gps]
extends = materiel
build_src_filter = -<*> +<setup.c> +<../test/materiel/test_gps.c>

[env:test_lumiere]
extends = materiel
build_src_filter = -<*> +<setup.c> +<../test/materiel/test_lumiere.c>

[env:test_sd]
extends = materiel
build_src_filter = -<*> +<setup.c> +<../test/materiel/test_SD.c>

[env:test_rtc]
extends = materiel
build_src_filter = -<*> +<setup.c> +<../test/materiel/test_rtc.c>

[env:native]
; Tests sur PC des parties sans matériel (test/). Nécessite gcc dans le PATH.
platform = native
test_framework = unity
build_flags = -D HOST_TEST -I test/stubs -I include -I lib/fatfs -I lib/bme68x -I lib/bme280 -I lib/cesi_grove/include
test_build_src = no
lib_ignore = cesi_grove, bme68x, bme280, fatfs
